  /portfolios/positions:
    get:
      tags: [Portfolios]
      summary: Open and closed positions across all portfolios
      description: >-
        Every position/portfolio membership across all of the identity's
        portfolios, including both open and closed positions. A position shared
        across portfolios appears once per membership, carrying that row's
        `portfolioId` and `portfolioName`; rows are not aggregated by symbol.

        Distinct from `/portfolios/held-stocks`, which aggregates BY SYMBOL and
        so cannot answer "which portfolio is this row from" — the question the
        cumulative Performance tab's performer cards exist to answer, since the
        same ticker can be held in two portfolios with very different results.
        Unlike `/portfolios/{id}/positions` it needs no id, and it deliberately
        returns no portfolio-specific derived state.

        `isOpen` distinguishes currently held positions from retained closed
        history, and `closedAt` records when a position was fully closed (null
        while it remains open). `portfolioName` is null on the per-portfolio
        route, which keeps satisfying the same `Position` schema unchanged.
      operationId: getAllPositions
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Positions
          content:
            application/json:
              schema:
                type: object
                properties:
                  positions:
                    type: array
                    items: { $ref: '#/components/schemas/Position' }
