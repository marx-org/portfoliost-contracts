      required: [items, pagination]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminUser' }
        pagination: { $ref: '#/components/schemas/AdminPagination' }

    AdminFxRate:
      type: object
      required: [date, baseCurrency, quoteCurrency, rate]
      properties:
        date:
          type: string
          format: date
          description: ECB reference rate date (EUR-based)
        baseCurrency: { type: string }
        quoteCurrency: { type: string }
        rate: { type: number }

    AdminFxRatesResponse:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminFxRate' }
        pagination: { $ref: '#/components/schemas/AdminPagination' }

    # ── Admin: curated listing overrides (#97) ─────────────────────────────
    # A reviewed, versioned override layer over the GitHub ticker-reference
    # sync. Upstream rows are never mutated: an override is a separate row
    # keyed on the venue-qualified listing key, and `precedence` states that
    # the curated value wins so the UI can show it rather than hide it.
    AdminListingOverride:
      type: object
      required:
        [listingKey, ticker, exchange, quoteCurrency, assetType, status,
         rationale, provenance, sourceVersion, createdAt, updatedAt,
         upstreamPresent, tickerConflict, precedence]
      properties:
        listingKey:
          type: string
          description: "`<EXCHANGE>::<TICKER>` — the venue-qualified primary key."
        ticker: { type: string }
        exchange:
          type: string
          description: Venue/exchange code (e.g. NYSE, LSE, TSX).
        quoteCurrency:
          type: string
          description: ISO-4217 quote currency for this listing.
        assetType: { type: string }
        status:
          type: string
          enum: [active, disabled]
        rationale:
          type: string
          description: Why the override exists (required; reviewed with the row).
        provenance:
          type: string
          description: Where the fact came from (issue ref, analyst, source URL).
        sourceVersion:
          type: string
          description: |
            Which writer won — `admin` for an admin edit, or the curated
            source version string when seeded from the versioned source.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        upstreamPresent:
          type: boolean
          description: A GitHub ticker-reference row exists for the same listingKey.
        tickerConflict:
          type: boolean
          description: More than one upstream row shares this ticker (venue ambiguity).
        precedence:
          type: string
          enum: [curated]
          description: |
            Curated always outranks upstream. Surfaced explicitly so a conflict
            is visible rather than silently resolved.

    AdminListingOverrideInput:
      type: object
      required: [ticker, exchange, quoteCurrency, assetType, rationale, provenance]
      properties:
        ticker: { type: string }
        exchange: { type: string }
        quoteCurrency: { type: string }
        assetType: { type: string }
        status:
          type: string
          enum: [active, disabled]
          default: active
        rationale: { type: string }
        provenance: { type: string }

    AdminListingOverridesResponse:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminListingOverride' }
        pagination: { $ref: '#/components/schemas/AdminPagination' }

    AdminListingOverrideHistoryEntry:
      type: object
      required: [id, listingKey, action, actor, createdAt]
      properties:
        id: { type: integer }
        listingKey: { type: string }
        action:
          type: string
          enum: [created, updated, disabled]
        snapshot:
          description: The override row as written, verbatim (free-form JSON).
        actor:
          type: string
          description: "`<user-id> <email>` of the writer."
        createdAt: { type: string, format: date-time }

    AdminListingOverrideHistoryResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminListingOverrideHistoryEntry' }

    AdminListingOverridePreview:
      type: object
      required: [listingKey, ticker, exchange, upstreamPresent, tickerConflict, precedence]
      properties:
        listingKey: { type: string }
        ticker: { type: string }
        exchange: { type: string }
        upstreamPresent:
          type: boolean
          description: An upstream GitHub row exists for this exact listing key.
        tickerConflict:
          type: boolean
          description: More than one upstream row shares this ticker.
        upstreamCurrency:
          type: string
          nullable: true
          description: |
            Quote currency the upstream reference currently resolves for this
            key, so a reviewer sees the value the override would replace.
        existingOverride:
          nullable: true
          description: The override already stored for this key, if any.
          allOf:
            - $ref: '#/components/schemas/AdminListingOverride'
        precedence:
          type: string
          enum: [curated]

    # ── Admin: Topology (D55 — system topology / data flow tab) ────────────
    TopologyStatusResponse:
      type: object
      required: [services, fetchedAt]
      properties:
        services:
          type: array
          items: { $ref: '#/components/schemas/TopologyServiceStatus' }
        fetchedAt:
          type: string
          format: date-time
          description: ISO-8601 timestamp of the status fetch
    TopologyServiceStatus:
      type: object
      required: [name, reachable, impl]
      properties:
        name:
          type: string
          description: Deployment name (matches the topology graph node id)
        reachable:
          type: boolean
          description: Whether /__meta responded within 3 s (HTTP workloads), or ready replicas >= desired replicas for k8s-only workloads (postgres/redis)
        impl:
          type: string
          enum: [real, mock, unknown, job]
        version:
          type: string
        replicas:
          type: object
          nullable: true
          required: [desired, ready]
          properties:
            desired: { type: integer }
            ready: { type: integer }
        restarts:
          type: integer
          nullable: true
    TopologyTrafficResponse:
      type: object
      required: [services, cachestProviders, fetchedAt]
      properties:
        services:
          type: array
          items: { $ref: '#/components/schemas/TopologyServiceTraffic' }
        cachestProviders:
          type: array
          items:
            type: object
            required: [provider, p99LatencyMs]
            properties:
              provider:
                type: string
                description: cachest outbound server_address label, e.g. openst or alphavantage.co
              p99LatencyMs: { type: number }
        fetchedAt:
          type: string
          format: date-time
          description: ISO-8601 timestamp of the traffic fetch
    TopologyServiceTraffic:
      type: object
      required: [name, source]
      properties:
        name:
          type: string
          description: Service name (matches the topology graph node id)
        requestsPerMin:
          type: number
          nullable: true
          description: Requests/min (HTTP) or transactions/min (databases)
        errorRate:
          type: number
          nullable: true
          description: Fraction of requests returning 4xx/5xx (0–1)
        p99LatencyMs:
          type: number
          nullable: true
          description: p99 request latency in ms (HTTP workloads only)
        cpuCores:
          type: number
          nullable: true
          description: Current CPU usage in cores (workload resource metrics)
        memoryBytes:
          type: number
          nullable: true
          description: Current working-set memory in bytes (workload resource metrics)
        connections:
          type: number
          nullable: true
          description: Open database connections (postgres only, via Crunchy exporter)
        source:
          type: string
          enum: [otel, ingress, none, prometheus]
          description: Metric source used (otel when D56 metrics present, ingress fallback, prometheus for k8s workload resource metrics, none when Prometheus unavailable)

paths:
  # ─── Auth (custom mock) ──────────────────────────────────────
  /auth/login:
    post:
      tags: [Auth]
      summary: Login with email and password
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Login success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new account
      operationId: register
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
  /auth/me:
    get:
      tags: [Auth]
      summary: Current authenticated user
      operationId: getMe
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeResponse' }
  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the caller's refresh session
      operationId: logout
      description: |
        Deletes the server-side refresh session identified by the submitted
        token's `jti`, so the session cannot be renewed. Idempotent: a missing
        or already-revoked session is still a 200.

        `id_token` is optional, and a client that omits it gets a 200 that
        revokes nothing — the token is what identifies the session. Expiry is
        not enforced, for the same reason as /auth/refresh.

        Note: this does not end the Pocket-ID session itself. The client must
        also navigate to Pocket-ID's end_session_endpoint to clear that.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                id_token:
                  type: string
                  description: The caller's current bearer token; may be expired.
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success: { type: boolean }
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Exchange an expired session for a fresh token
      operationId: refresh
      description: |
        Rotates the server-side refresh session identified by the submitted
        token's `jti` and returns a new one.

        The refresh token never leaves the backend: it is held hashed, keyed by
        the `jti` of the id_token handed to the client, and re-keyed to the new
        `jti` on every call. Rotation is mandatory — the old token is consumed,
        so replaying a previously used id_token fails with 401.

        Callers must serialise this: concurrent 401s should share one in-flight
        refresh, or all but the first will fail.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: Refreshed — a new access_token for the same user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401':
          description: |
            No refresh session for this token, or the token failed signature /
            issuer / audience verification. The client must re-authenticate.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

