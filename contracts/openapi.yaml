        currencySource: { $ref: '#/components/schemas/CurrencySource', description: "How currency was determined (provider/estimated/unknown, plan §47.3)" }
        baseCurrency: { type: string, nullable: true, description: "ISO-4217 the series is natively denominated in (resolved; null when unknown). Equals currency when no conversion was applied (plan §48.2)" }
        fxFrom: { type: string, format: date, nullable: true, description: "Earliest FX rate date covering the window. §72.17 SUPERSEDES the old rule this field documented: a bar that cannot be converted is **absent from the response**, not passed through in the native baseCurrency. So when a conversion was requested this is the first row of the returned series, and the series may be shorter than the requested window. Do not reimplement the pre-§72.17 behaviour — a base-currency price under a target-currency label is how a portfolio read 85 PLN one day and ~400 the next. Null when no conversion was applied." }
