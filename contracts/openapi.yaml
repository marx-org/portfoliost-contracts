          type: string
          enum: [Running, Succeeded, Failed, NotFound]

    StooqImportStatusResponse:
      type: object
      required: [dataset, jobName, status]
      properties:
        dataset:
          $ref: '#/components/schemas/StooqDataset'
        jobName:
          type: string
        status:
          type: string
          enum: [Running, Succeeded, Failed, NotFound]
        details:
          type: object
          properties:
            active:    { type: integer }
            succeeded: { type: integer }
            failed:    { type: integer }

    StooqImportLogEntry:
      type: object
      required: [dataset]
      description: >
        Per-dataset import history sourced from admin.job_run.
        importedAt reflects started_at (job trigger time) until the post-import
        hook writes a confirmed value. latestDate and rowsDeleted are null until
        the post-import hook is wired (open item D53).
      properties:
        dataset:
          $ref: '#/components/schemas/StooqDataset'
        latestDate:
          type: string
          format: date
          nullable: true
          description: MAX(date) confirmed from stooq foreign table after import (written by post-import hook)
        importedAt:
          type: string
          format: date-time
          nullable: true
          description: When the import job was started (started_at); updated to hook-call time once post-import hook is wired
        rowsDeleted:
          type: integer
          nullable: true
          description: Overflow rows cleaned up in the last run (written by post-import hook)

    SplitCandidate:
      type: object
      required: [symbol, detectedAt, effectiveDate, status]
      description: Provider-backed or heuristic split candidate. detectedAt is discovery time; effectiveDate is when the split took effect.
      properties:
        symbol:            { type: string }
        detectedAt:        { type: string, format: date }
        effectiveDate:     { type: string, format: date, nullable: true }
        lastStooqDate:     { type: string, format: date, nullable: true }
        lastStooqClose:    { type: string, nullable: true }
        firstOverflowDate: { type: string, format: date, nullable: true }
        firstOverflowClose: { type: string, nullable: true }
        ratio:             { type: string, nullable: true }
        suggestedFactor:   { type: string, nullable: true }
        suggestedRatio:    { type: string, nullable: true }
        provider:          { type: string, nullable: true }
        providerNumerator: { type: string, nullable: true }
        providerDenominator: { type: string, nullable: true }
        providerFactor:    { type: string, nullable: true }
        providerStatus:    { type: string }
        evidence:          { nullable: true }
        appliedAt:         { type: string, format: date-time, nullable: true }
        status:
          type: string
          enum: [pending, applied, dismissed]

    OverflowSummary:
      type: object
      required: [total, topSymbols]
      properties:
        total: { type: integer }
        topSymbols:
          type: array
          items:
            type: object
            required: [symbol, rowCount]
            properties:
              symbol:   { type: string }
              rowCount: { type: integer }

    AdminPagination:
      type: object
      required: [total, page, per_page, total_pages]
      properties:
        total: { type: integer }
        page: { type: integer }
        per_page: { type: integer }
        total_pages: { type: integer }

    AdminUser:
      type: object
      required: [id, groups, lastLogin, createdAt]
      properties:
        id:
          type: string
          format: uuid
          description: User's stable id (PocketID subject / portfoliost user id)
        email: { type: string, format: email, nullable: true }
        firstName: { type: string, nullable: true }
        lastName: { type: string, nullable: true }
        groups:
          type: array
          items: { type: string }
          description: Group memberships for authorization
        lastLogin:
          type: string
          format: date-time
          nullable: true
          description: Last successful authentication (null if never logged in)
        createdAt:
          type: string
          format: date-time

    AdminUserListResponse:
