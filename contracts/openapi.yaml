openapi: 3.0.3
info:
  title: Portfoliost API
  version: 1.0.0
  description: |
    Portfoliost API contract — shared between frontend and backend.
    Based on the Example service API with portfoliost-specific deviations.

servers:
  - url: http://localhost:8080/api
    description: Via the dev nginx proxy (Docker Compose)
  - url: http://localhost:3000/api
    description: Direct backend (development)

tags:
  - name: Auth
    description: Custom mock authentication (replaces Supabase)
  - name: Users
  - name: Billing
  - name: Notifications
  - name: News
  - name: Instruments
  - name: Charting
  - name: Portfolios
  - name: Watchlists
  - name: Copilot
  - name: Misc
  - name: Admin
    description: Admin panel APIs (requires portfoliost_admin group)
  - name: Internal
    description: Cluster-internal endpoints (no auth — never exposed through the gateway)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    symbol:
      name: symbol
      in: path
      required: true
      schema: { type: string }
      description: Instrument symbol, e.g. AAPL or AAPL.US
    portfolioId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    watchlistId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    positionId:
      name: positionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    eventId:
      name: eventId
      in: path
      required: true
      schema: { type: string }
    cursor:
      name: cursor
      in: query
      schema: { type: string }
      description: Opaque cursor for keyset pagination
    currency:
      name: currency
      in: query
      schema: { type: string }
      description: Optional ISO-4217 target currency — prices are converted server-side (plan §48.2); same/absent value serves the native series
    baseCurrency:
      name: baseCurrency
      in: query
      schema: { type: string }
      description: >-
        Optional ISO-4217 currency the CALLER believes the prices are denominated in
        (e.g. wallets passes the position's `instrumentCurrency`). Honoured only where
        the server's own resolver is silent; a locally resolved base is never
        overridden (plan §47, "never guess"). Without it, a ticker listed on several
        venues in different currencies cannot be converted at all, which made
        `currency` unusable for the caller's whole request (plan §63.10.5).
    limit:
      name: limit
      in: query
      schema: { type: integer, default: 10 }
    page:
      name: page
      in: query
      schema: { type: integer, default: 1 }
    perPage:
      name: perPage
      in: query
      schema: { type: integer, default: 10 }
    timeframe:
      name: timeframe
      in: query
      schema:
        type: string
        enum: [1D, 5D, 1W, 1M, 3M, 6M, YTD, 1Y, 2Y, 3Y, 5Y, ALL]
        default: 1Y
    benchmark:
      name: benchmark
      in: query
      schema: { type: string }
      description: Benchmark symbol to overlay (e.g. SPY)
    benchmarks:
      name: benchmarks
      in: query
      schema: { type: string }
      description: Comma-separated benchmark symbols to overlay (e.g. SPY,QQQ)
    benchmarkCalcType:
      name: benchmarkCalcType
      in: query
      schema:
        type: string
        enum: [moneyWeighted, timeWeighted, simple]
        default: timeWeighted
      description: Return-type calculation used for benchmark series and the authoritative portfolio return line (default timeWeighted)

  schemas:
    # ─── Shared ────────────────────────────────────────────────
    ErrorResponse:
      type: object
      properties:
        error: { type: string }
        message: { type: string }
        statusCode: { type: integer }
    Pagination:
      type: object
      properties:
        count: { type: integer }
        total_count: { type: integer }
        has_next_page: { type: boolean }
        has_previous_page: { type: boolean }
        next_cursor: { type: string, nullable: true }
        previous_cursor: { type: string, nullable: true }
    PageResponse:
      type: object
      properties:
        items: { type: array, items: { type: object } }
        total: { type: integer }
        page: { type: integer }
        limit: { type: integer }
        totalPages: { type: integer }
        hasNext: { type: boolean }
        hasPrevious: { type: boolean }

    # ─── Auth ──────────────────────────────────────────────────
    LoginPayload:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    RefreshRequest:
      type: object
      required: [id_token]
      properties:
        id_token:
          type: string
          description: |
            The caller's current bearer token. It is normally already expired —
            that is the normal case, not an error. The signature, issuer and
            audience are verified; `exp` is deliberately NOT checked, because
            the token's only job here is to identify which server-side refresh
            session to rotate. Never read identity claims from the raw body.
    AuthResponse:
      type: object
      required: [access_token, token_type, user]
      properties:
        access_token: { type: string }
        token_type: { type: string, default: bearer }
        expires_in: { type: integer }
        user:
          $ref: '#/components/schemas/AuthUser'
    AuthUser:
      type: object
      required: [id, email, language, role, isDemoUser, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        language: { type: string }
        role: { type: string }
        groups:
          type: array
          items: { type: string }
          description: User's group memberships for authorization
        avatarUrl: { type: string, format: uri, nullable: true, description: "URL to user's avatar image from identity provider" }
        isDemoUser: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        lastLoginAt: { type: string, format: date-time, nullable: true }
    MeResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/AuthUser'

    # ─── Users ─────────────────────────────────────────────────
    UserProfile:
      type: object
      required: [id, email, groups, language, createdAt, updatedAt, isDemoUser]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        firstName: { type: string, nullable: true }
        lastName: { type: string, nullable: true }
        avatarUrl: { type: string, format: uri, nullable: true, description: "URL to user's avatar image from identity provider" }
        groups:
          type: array
          items: { type: string }
        language: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        isDemoUser: { type: boolean }
        recentSearches:
          type: array
          maxItems: 10
          items: { type: string }
          description: "User's last 10 searched stock symbols, most recent first"
    UpdateProfileRequest:
      type: object
      properties:
        firstName: { type: string, nullable: true }
        lastName: { type: string, nullable: true }
        language: { type: string }
        recentSearches:
          type: array
          maxItems: 10
          items: { type: string }
          description: "User's last 10 searched stock symbols, most recent first"
    UserPreferences:
      type: object
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        uiPreferences: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CustomBenchmarksResponse:
      type: object
      properties:
        items: { type: array, items: { type: object, additionalProperties: true } }
    CustomTimeframesResponse:
      type: object
      properties:
        items: { type: array, items: { type: object, additionalProperties: true } }
    OnboardingStatus:
      type: object
      properties:
        completed: { type: boolean }
        currentStep: { type: string, nullable: true }
    OnboardingDraft:
      type: object
      properties:
        draft: { nullable: true }

    # ─── Billing ───────────────────────────────────────────────
    BillingPlans:
      type: object
      properties:
        plans:
          type: array
          items:
            type: object
            properties:
              tier: { type: string }
              name: { type: string }
              prices:
                type: array
                items:
                  type: object
                  properties:
                    priceId: { type: string }
                    interval: { type: string }
                    amount: { type: integer }
                    currency: { type: string }
              features: { type: array, items: { type: string } }
    BillingSubscription:
      type: object
      properties:
        planTier: { type: string }
        status: { type: string }
        billingInterval: { type: string, nullable: true }
        currentPeriodStart: { type: string, nullable: true }
        currentPeriodEnd: { type: string, nullable: true }
        trialStart: { type: string, nullable: true }
        trialEnd: { type: string, nullable: true }
        cancelAtPeriodEnd: { type: boolean }
        cancelAt: { type: string, nullable: true }
        isTrialing: { type: boolean }
    BillingEntitlements:
      type: object
      properties:
        tier: { type: string }
        isTrialing: { type: boolean }
        features:
          type: object
          additionalProperties:
            type: object
            properties:
              enabled: { type: boolean }
              limit: { nullable: true }
              delayMinutes: { type: integer }

    # ─── Notifications ─────────────────────────────────────────
    NotificationsList:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Notification' } }
        nextCursor: { type: string, nullable: true }
        unreadCount: { type: integer }
    Notification:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string }
        title: { type: string }
        message: { type: string }
        isRead: { type: boolean }
        createdAt: { type: string, format: date-time }
        metadata: { type: object, additionalProperties: true }
    NotificationPreferences:
      type: object
      properties:
        newsEnabled: { type: boolean }
        newsMinActionability: { type: string, nullable: true }
        newsMaterialOnly: { type: boolean }
        earningsEnabled: { type: boolean }
        insiderEnabled: { type: boolean }
        insiderMinValueUsd: { type: number, nullable: true }
        analystEnabled: { type: boolean }
        analystDirection: { type: string, nullable: true }
        channelsWeb: { type: boolean }
        channelsPush: { type: boolean }
        channelsEmail: { type: boolean }
    NotificationSymbols:
      type: object
      properties:
        items: { type: array, items: { type: object } }
        totalEnabled: { type: integer }
        totalMuted: { type: integer }
    UnreadCount:
      type: object
      properties:
        count: { type: integer }
    # ─── News ──────────────────────────────────────────────────
    NewsArticleList:
      type: object
      properties:
        data: { type: array, items: { type: object, additionalProperties: true } }
        pagination:
          $ref: '#/components/schemas/Pagination'
    NewsTimeline:
      type: object
      properties:
        data: { type: array, items: { type: object, additionalProperties: true } }
        pagination:
          $ref: '#/components/schemas/Pagination'
    MarketContexts:
      type: object
      properties:
        error: { nullable: true }
        data:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              scope: { type: string }
              type: { type: string }
              summary: { type: string }
    NewsStats:
      type: object
      properties:
        error: { nullable: true }
        data:
          type: object
          additionalProperties: true
    TrackedTickers:
      type: object
      properties:
        data:
          type: object
          properties:
            tickers:
              type: array
              items:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  symbol: { type: string }
                  createdAt: { type: string, format: date-time }
                  totalArticleCount: { type: integer }
                  totalAnalyzedArticleCount: { type: integer }
                  lastFetchedAt: { type: string, format: date-time }
                  isActive: { type: boolean }
                  isDefault: { type: boolean }
    LiveStreamChannel:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        handle: { type: string }
        fallbackVideoId: { type: string, nullable: true }
        hlsUrl: { type: string, nullable: true }
        region: { type: string, nullable: true }
        category: { type: string, nullable: true }
    LiveStream:
      type: object
      properties:
        videoId: { type: string, nullable: true }
        isLive: { type: boolean }
        hlsUrl: { type: string, nullable: true }
    NewsInsights:
      type: object
      properties:
        data:
          type: array
          items: { type: object, additionalProperties: true }

    # ─── Instruments ───────────────────────────────────────────
    # D82 — instrument asset class. STOCK/ETF/BOND/CRYPTO pre-existed (as
    # free-form strings); FUND and CORP_BOND are added for TFI funds and Catalyst
    # corporate bonds (D80/D81). Consumers may still treat the field as a string.
    CurrencySource:
      type: string
      enum: [provider, estimated, unknown]
      description: |
        How the instrument `currency` was determined (plan §47):
        - `provider` — the upstream provider declared the currency (e.g. the
          biznesradar `priceCurrency` meta tag);
        - `estimated` — no provider declaration; resolved locally from the
          symbol (e.g. `.TFI`/`.FIZ` → PLN) or the exchange;
        - `unknown` — nothing is known; `currency` is null and must never be
          silently defaulted to a code.

    InstrumentType:
      type: string
      enum: [STOCK, ETF, BOND, CRYPTO, FUND, CORP_BOND]

    InstrumentDetail:
      type: object
      properties:
        id: { type: string }
        symbol: { type: string }
        name: { type: string }
        exchange: { type: string }
        type: { $ref: '#/components/schemas/InstrumentType' }
        currency: { type: string, nullable: true, description: "ISO-4217; null when the provider does not declare one (45.2 — never guessed)" }
        currencySource: { $ref: '#/components/schemas/CurrencySource', description: "How currency was determined (provider/estimated/unknown, plan §47.3)" }
    InstrumentProfile:
      type: object
      properties:
        ticker: { type: string }
        name: { type: string }
        country: { type: string, nullable: true }
        countryCode: { type: string, nullable: true }
        assetType:
          type: string
          nullable: true
          description: >-
            Contract `InstrumentType` for the shared identity block
            (`TickerBadge`). Resolved from the local ticker reference, like
            `countryCode`; null when the symbol is not in it — never guessed
            (§61.8).
        isin: { type: string, nullable: true }
        currency: { type: string, nullable: true, description: "ISO-4217; null when the provider does not declare one (45.2 — never guessed)" }
        exchange: { type: string }
        finnhubIndustry: { type: string, nullable: true }
        ipo: { type: string, nullable: true }
        currencySource: { $ref: '#/components/schemas/CurrencySource', description: "How currency was determined (provider/estimated/unknown, plan §47.3)" }
        logo: { type: string, nullable: true }
        marketCapitalization: { type: number, nullable: true }
        marketCapCurrency: { type: string, nullable: true }
        marketcapUSD: { type: number, nullable: true }
        phone: { type: string, nullable: true }
        shareOutstanding: { type: number, nullable: true }
        weburl: { type: string, nullable: true }
        description: { type: string, nullable: true }
        gicsSector: { type: string, nullable: true }
        gicsIndustryGroup: { type: string, nullable: true }
        gicsIndustry: { type: string, nullable: true }
        gicsSubIndustry: { type: string, nullable: true }
        address: { type: string, nullable: true }
        city: { type: string, nullable: true }
        state: { type: string, nullable: true }
        employeeTotal: { type: number, nullable: true }
        ceo: { type: string, nullable: true }
        keyFacts:
          oneOf:
            - $ref: '#/components/schemas/StockKeyFacts'
            - $ref: '#/components/schemas/EtfKeyFacts'
            - $ref: '#/components/schemas/FundKeyFacts'
            - $ref: '#/components/schemas/CryptoKeyFacts'
            - $ref: '#/components/schemas/BondKeyFacts'
            - $ref: '#/components/schemas/CorpBondKeyFacts'
          nullable: true
          description: >-
            Per-asset-class key facts, discriminated by `kind` (plan §86). Null
            when the provider tier has nothing class-specific to say for this
            symbol. `kind` is deliberately redundant with `assetType`:
            `assetType` is the SCREAMING_CASE contract enum and is null when the
            symbol is missing from the local reference table, whereas `kind` is
            non-null whenever `keyFacts` is present, which is what makes the union
            discriminable. The two are not merged.
    StockKeyFacts:
      type: object
      description: >-
        Equity-only key facts. Every field is a relocation of a value already on
        the profile — no new upstream call (§86.7).
      required: [kind]
      properties:
        kind: { type: string, const: stock, description: "Discriminant; always `stock`." }
        sector: { type: string, nullable: true, description: "GICS sector. Null for an unsynced symbol rather than guessed." }
        industry: { type: string, nullable: true, description: "GICS industry." }
        employees: { type: number, nullable: true, description: "Employee total; null when the provider does not carry it." }
        ceo: { type: string, nullable: true, description: "Provider string, verbatim." }
        ipo: { type: string, nullable: true }
        sharesOutstanding: { type: number, nullable: true }
        marketCap: { type: number, nullable: true, description: "In `marketCapCurrency`." }
    EtfKeyFacts:
      type: object
      description: >-
        One field, and it is a row the backend already fills today and the UI
        discarded: `ticker_reference.etf_category` (§86).
      required: [kind]
      properties:
        kind: { type: string, const: etf, description: "Discriminant; always `etf`." }
        category: { type: string, nullable: true, description: "e.g. `Equity`, `Fixed Income`; null when the reference row carries none." }
    FundKeyFacts:
      type: object
      required: [kind]
      description: >-
        One field, on purpose. The local fund reference carries name + aliases
        only — there is no manager, category type, OPL/TER, risk class or
        recommended holding period anywhere in the stack, so the page says so
        rather than implying coverage. The TFI detail importer that would fix
        this is recorded as follow-up (§86.10).
      properties:
        kind: { type: string, const: fund, description: "Discriminant; always `fund`." }
        categoryCode: { type: string, nullable: true, description: "ANALIZY listing code; null for a `TFI::` reference key, which carries none." }
    CryptoKeyFacts:
      type: object
      description: >-
        Exactly what the one configured crypto-search provider returns (§86).
        Market cap, rank, ATH and ATL are **not** declared as nullable fields:
        they are unavailable from the provider, which is a different statement
        from "we fetch it and it happens to be empty".
      required: [kind]
      properties:
        kind: { type: string, const: crypto, description: "Discriminant; always `crypto`." }
        name: { type: string, nullable: true }
        exchange: { type: string, nullable: true, description: "Provider venue code; constant in practice for the current provider." }
        icoDate: { type: string, format: date, nullable: true }
        circulatingSupply: { type: number, nullable: true, description: "Null, never 0, when the provider does not carry it." }
        totalSupply: { type: number, nullable: true, description: "Null, never 0, when the provider does not carry it." }
    BondKeyFacts:
      type: object
      description: >-
        Polish retail savings bond. Deliberately a separate schema from
        `CorpBondKeyFacts`: the two field sets are disjoint apart from maturity
        and nominal, and one schema with fourteen nullable fields would make
        every reader know which half applies (§86).
      required: [kind]
      properties:
        kind: { type: string, const: bond, description: "Discriminant; always `bond`." }
        seriesCode: { type: string, nullable: true }
        issueDate: { type: string, format: date, nullable: true }
        maturityDate: { type: string, format: date, nullable: true }
        termMonths: { type: number, nullable: true, description: "0 is a real value, not a missing one." }
        rateRule: { type: string, nullable: true, description: "`fixed` | `cpi_12m+margin` | `nbp_ref+margin`; determines what `margin` means." }
        margin:
          type: number
          nullable: true
          description: >-
            Overloaded, and the label depends on `rateRule` (§86): under `fixed`
            it **is** the flat annual rate, under `cpi_12m+margin` it is the
            inflation add-on, under `nbp_ref+margin` the NBP add-on. Never render
            it as "Margin" without switching on `rateRule`.
        redemptionFee: { type: number, nullable: true, description: "Fee `b`, in the quote currency." }
        nominal: { type: number, nullable: true }
    CorpBondKeyFacts:
      type: object
      description: >-
        Catalyst corporate bond (obligacje.pl). `nominalValue` and
        `currentRate` are numbers here even though the provider sends strings
        (`"100.0"`, `"7.83%"`): the unit is stripped in the translator, with a
        guard that yields null rather than NaN. `secured` and `status` stay
        strings — they are provider text rendered verbatim, never translated
        (§86).
      required: [kind]
      properties:
        kind: { type: string, const: corp_bond, description: "Discriminant; always `corp_bond`." }
        issuer: { type: string, nullable: true, description: "Verbatim." }
        series: { type: string, nullable: true }
        market: { type: string, nullable: true }
        status: { type: string, nullable: true, description: "Verbatim, e.g. `Notowane`." }
        nominalValue: { type: number, nullable: true }
        nominalCurrency: { type: string, nullable: true, description: "ISO-4217." }
        secured: { type: string, nullable: true, description: "Provider's Polish boolean string (`NIE`), verbatim — never mapped to a boolean." }
        couponType: { type: string, nullable: true, description: "Verbatim, carries its own embedded margin for variable-rate bonds." }
        currentRate: { type: number, nullable: true, description: "Percent as a number (7.83), never the raw `\"7.83%\"`." }
        maturityDate: { type: string, format: date, nullable: true }
    InstrumentMetrics:
      type: object
      properties:
        metrics:
          type: object
          properties:
            symbol: { type: string }
            metricType: { type: string }
            metric: { type: object, additionalProperties: true }
        priceTarget:
          type: object
          properties:
            symbol: { type: string }
            targetHigh: { type: number }
            targetLow: { type: number }
            targetMean: { type: number }
            targetMedian: { type: number }
            numberAnalysts: { type: integer }
            lastUpdated: { type: string }
        trailingValuation:
          type: object
          properties:
            marketCap: { type: number }
            enterpriseValue: { type: number }
            peRatio: { type: number }
            psRatio: { type: number }
            pbRatio: { type: number }
            evToSales: { type: number }
            evToEBITDA: { type: number }
            dividendYield: { type: number }
            dividendPerShare: { type: number }
            payoutRatio: { type: number }
            pegRatio: { type: number }
            priceTarget: { type: number }
            dpsGrowth5yr: { type: number }
            priceToFcf: { type: number }
            evToGrossProfit: { type: number }
        margins:
          type: object
          properties:
            grossMargin: { type: number }
            operatingMargin: { type: number }
            ebitdaMargin: { type: number }
            netProfitMargin: { type: number }
        capitalEfficiency:
          type: object
          properties:
            returnOnAssets: { type: number }
            returnOnTotalAssets: { type: number }
            returnOnEquity: { type: number }
            assetTurnover: { type: number }
            inventoryTurnover: { type: number }
        financialHealth:
          type: object
          properties:
            currentRatio: { type: number }
            quickRatio: { type: number }
        perShare:
          type: object
          properties:
            revenuePerShare: { type: number }
            eps: { type: number }
            bookValuePerShare: { type: number }
            tangibleBookValuePerShare: { type: number }
            cashPerShare: { type: number }
            operatingCashFlowPerShare: { type: number }
    InstrumentOverviewMetrics:
      type: object
      properties:
        symbol: { type: string }
        marketCap: { type: number }
        enterpriseValue: { type: number }
        sharesOutstanding: { type: number }
        revenue: { type: number }
        employees: { type: number, nullable: true }
        cash: { type: number }
        netDebt: { type: number }
        revenueGrowth3yr: { type: number }
        revenueGrowth5yr: { type: number }
        revenueGrowth10yr: { type: number }
        epsGrowth3yr: { type: number }
        epsGrowth5yr: { type: number }
        epsGrowth10yr: { type: number }
        revenueGrowthFwd: { type: number }
        epsGrowthFwd: { type: number }
