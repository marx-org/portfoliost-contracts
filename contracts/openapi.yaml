        '200':
          description: Paginated admin user list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUserListResponse' }
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Not a portfoliost_admin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /admin/currencies/rates:
    get:
      tags: [Admin]
      summary: Page through EUR-based FX reference rates with filters
      description: |
        Admin-facing list of ECB reference rates (base is always EUR).
        Sorting, filtering and pagination are all server-side.
      operationId: listAdminFxRates
      security: [{ bearerAuth: [] }]
      parameters:
        - name: page
          in: query
          required: false
          schema: { type: integer, default: 1 }
        - name: per_page
          in: query
          required: false
          schema: { type: integer, default: 50, maximum: 200 }
        - name: sort_by
          in: query
          required: false
          schema: { type: string, enum: [date, base_currency, quote_currency, rate], default: date }
        - name: sort_dir
          in: query
          required: false
          schema: { type: string, enum: [asc, desc], default: desc }
        - name: base_currency
          in: query
          required: false
          schema: { type: string, description: Exact base currency (EUR for all rows) }
        - name: quote_currency
          in: query
          required: false
          schema: { type: string, description: Exact quote currency filter }
        - name: date_from
          in: query
          required: false
          schema: { type: string, format: date, description: Inclusive lower bound }
        - name: date_to
          in: query
          required: false
          schema: { type: string, format: date, description: Inclusive upper bound }
      responses:
        '200':
          description: Paginated FX rate list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminFxRatesResponse' }
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Not a portfoliost_admin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /admin/listing-overrides:
    get:
      tags: [Admin]
      summary: List and search curated listing overrides
      description: |
        Admin-facing list of curated venue overrides. Search matches ticker,
        venue and listing key; `status` filters active/disabled. Each row
        carries `upstreamPresent`, `tickerConflict` and `precedence` so the
        reviewer sees how it relates to the upstream GitHub reference.
      operationId: listAdminListingOverrides
      security: [{ bearerAuth: [] }]
      parameters:
        - name: page
          in: query
          required: false
          schema: { type: integer, default: 1 }
        - name: per_page
          in: query
          required: false
          schema: { type: integer, default: 100, maximum: 200 }
        - name: search
          in: query
          required: false
          schema: { type: string, description: Ticker, venue, or listing key substring }
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [active, disabled] }
      responses:
        '200':
          description: Paginated override list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminListingOverridesResponse' }
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Not a portfoliost_admin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    post:
      tags: [Admin]
      summary: Create a curated listing override
      operationId: createAdminListingOverride
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminListingOverrideInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminListingOverride' }
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Not a portfoliost_admin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: An override for this listing key already exists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: Validation failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /admin/listing-overrides/preview:
    get:
      tags: [Admin]
      summary: Preview upstream conflict and precedence for a prospective override
      description: |
        Resolves the upstream/conflict picture for a ticker+venue *before* an
        override is saved, so the reviewer can see the upstream currency and any
        ambiguity the override would take precedence over.
      operationId: previewAdminListingOverride
      security: [{ bearerAuth: [] }]
      parameters:
        - name: ticker
          in: query
          required: true
          schema: { type: string }
        - name: exchange
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Precedence and conflict metadata for the proposed key
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminListingOverridePreview' }
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Not a portfoliost_admin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: Ticker or exchange missing/invalid
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /admin/listing-overrides/{listingKey}:
    parameters:
      - name: listingKey
        in: path
        required: true
        schema: { type: string }
        description: "`<EXCHANGE>::<TICKER>` (URL-encoded)"
    put:
      tags: [Admin]
      summary: Edit a curated listing override
      operationId: updateAdminListingOverride
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminListingOverrideInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminListingOverride' }
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Not a portfoliost_admin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: No override with that listing key
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: Validation failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /admin/listing-overrides/{listingKey}/disable:
    parameters:
      - name: listingKey
        in: path
        required: true
        schema: { type: string }
        description: "`<EXCHANGE>::<TICKER>` (URL-encoded)"
    post:
      tags: [Admin]
      summary: Disable a curated listing override
      description: Flips status to `disabled`; the row and its history are retained.
      operationId: disableAdminListingOverride
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Disabled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminListingOverride' }
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Not a portfoliost_admin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: No override with that listing key
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /admin/listing-overrides/{listingKey}/history:
    parameters:
      - name: listingKey
        in: path
        required: true
        schema: { type: string }
        description: "`<EXCHANGE>::<TICKER>` (URL-encoded)"
    get:
      tags: [Admin]
      summary: Audit history for a curated listing override
      operationId: getAdminListingOverrideHistory
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: History, newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminListingOverrideHistoryResponse' }
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Not a portfoliost_admin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  # ─── Internal (cluster-internal, no gateway exposure) ───────
  /internal/apply-split:
    post:
      tags: [Internal]
      summary: Retroactively adjust portfolio transactions for a stock split
      operationId: applySplit
      description: >-
        No auth — reachable only inside the cluster. Recomputes quantity/price
        for all transactions of a symbol before the effective date from the
        frozen original_quantity/original_price; idempotent.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApplySplitRequest' }
      responses:
        '200':
          description: Adjusted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApplySplitResponse' }
        '500':
          description: Internal error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
