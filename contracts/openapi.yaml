            currency: { type: string, minLength: 3, maxLength: 3, description: Currency of every allocation row below except byCurrency, whose rows carry their own ISO code in `name`. }
            byAsset:
              type: array
              items:
                type: object
                properties:
                  name: { type: string }
                  value: { type: number }
            bySector:
              type: array
              items:
                type: object
                properties:
                  name: { type: string }
                  value: { type: number }
            byGeography:
              type: array
              items:
                type: object
                properties:
                  name: { type: string }
                  value: { type: number }
            byIndustry:
              type: array
              items:
                type: object
                properties:
                  name: { type: string }
                  value: { type: number }
            byPosition:
              type: array
              items:
                type: object
                properties:
                  name: { type: string }
                  value: { type: number }
            byAssetType:
              type: array
              items:
                type: object
                properties:
                  name: { type: string }
                  value: { type: number }
            byCurrency:
              type: array
              description: Each row is denominated in its OWN currency, which is its `name` as an ISO-4217 code — this is the one breakdown that is not in the allocation `currency`.
              items:
                type: object
                properties:
                  name: { type: string, description: ISO-4217 currency code for this row. }
                  value: { type: number }
        items:
          type: array
          items: { $ref: '#/components/schemas/CompareRow' }
        topPerformers: { type: array, items: { type: object } }
        bottomPerformers: { type: array, items: { type: object } }
        concentrationRisks: { type: array, items: { type: object } }
        correlationMatrix: { type: array, items: { type: array, items: { type: number } } }
    PortfolioRiskMetrics:
      type: object
      properties:
        sharpeRatio: { type: number }
        sortinoRatio: { type: number }
        calmarRatio: { type: number }
        volatility: { type: number }
        maxDrawdown: { type: number }
        winRate: { type: number }
        moneyWeightedReturn: { type: number, nullable: true }
        periodReturnPercent: { type: number }
        annualizedReturn: { type: number, nullable: true }
        annualizedReturnWithheldReason: { type: string, nullable: true }
        moneyWeightedReturnWithheldReason: { type: string, nullable: true }
    PortfolioDetail:
      allOf:
        - $ref: '#/components/schemas/Portfolio'
        - type: object
          properties:
            metrics:
              type: object
              required: [totalReturn, totalReturnAmount, dayChange, dayChangeAmount, dayChangeDate, asOf, positionCount, openPositions, closedPositions, realizedGainLoss, unrealizedGainLoss, capitalBasis, income, returnBasis]
              properties:
                totalReturn: { type: number }
                totalReturnAmount: { type: number }
                dayChange: { type: number }
                dayChangeAmount: { type: number }
                dayChangeDate: { type: string }
                asOf: { type: string, format: date-time }
                positionCount: { type: integer }
                openPositions: { type: integer }
                closedPositions: { type: integer }
                realizedGainLoss: { type: number }
                unrealizedGainLoss: { type: number }
                capitalBasis: { type: number }
                income: { type: number }
                returnBasis: { type: number }
                capitalBasisReturnPercent: { type: number, nullable: true }
                capitalBasisReturnAmount: { type: number, nullable: true }
                capitalBasisSource: { type: string, nullable: true }
                capitalBasisSuppressedReason: { type: string, nullable: true }
                capitalBasisReturnBasisKind: { type: string, nullable: true }
            positions:
              type: array
              items: { $ref: '#/components/schemas/PositionSummary' }
            cash:
              $ref: '#/components/schemas/PortfolioCash'
    PositionSummary:
      type: object
      required: [id, portfolioId, symbol, assetType, quantity, avgCostBasis, totalCostBasis, currentPrice, marketValue, realizedGainLoss, unrealizedGainLoss, sector, industry, country, purchaseCurrency, stockCurrency, contractSize, isCfd, displayCurrency, instrumentAvgCostBasis]
      properties:
        id: { type: string, format: uuid }
        # #115 — the portfolio this row is viewed under; ownership is many-to-many.
        portfolioId: { type: string, format: uuid }
        symbol: { type: string }
        assetType: { type: string }
        quantity: { type: number }
        avgCostBasis: { type: number }
        totalCostBasis: { type: number }
        currentPrice: { type: number }
        marketValue: { type: number }
        realizedGainLoss: { type: number }
        unrealizedGainLoss: { type: number }
        sector: { type: string }
        industry: { type: string }
        country: { type: string }
        purchaseCurrency: { type: string }
        stockCurrency: { type: string }
        finnhubSecurityType: { type: string }
        contractSize: { type: number }
        isCfd: { type: boolean }
        openedAt: { type: string, format: date-time }
        closedAt: { type: string, nullable: true }
        updatedAt: { type: string, format: date-time }
        displayCurrency: { type: string }
        instrumentAvgCostBasis: { type: number }
    PortfolioSummaryMetrics:
      type: object
      required: [currency, totalValue, cashValue, capitalBasis, simpleReturnPercent, investmentReturnPercent, currencyImpactPercent, cumulativeDividends, totalDividends, positionValue, realizedGain, costBasis, unrealizedGainLoss, dayChangeAmount, dayChangePercent, dayChangeDate]
      properties:
        # §66.3 — the portfolio's base currency. Every amount on this object is
        # denominated in it. It was absent, so the SPA had to guess (and did:
        # `formatCurrency(portfolio.currentValue)` rendered PLN with a `$`).
        currency: { type: string, minLength: 3, maxLength: 3, description: The portfolio's base currency (ISO-4217). Every amount on this object is denominated in it. }
        # §68 — totalValue includes cash, matching /total-metrics and the cards.
        # positionValue IS the instruments component (positions only), so it is
        # documented rather than duplicated under a second name — the same lesson
        # as §67.2: do not add a field that already exists under another name.
        # cashValue is new, and is what makes the split explicit on the card.
        totalValue: { type: number, description: positionValue + cashValue (cash included, §68). Every amount here is converted into `currency`; a raw cross-currency sum is not acceptable. }
        cashValue: { type: number, description: This portfolio's cash balance in `currency`. May be negative on a margin account. }
        capitalBasis: { type: number, description: 'Capital BASIS: external contributions plus the cost of anything transferred in or out, signed. At COST — see PortfolioTotalMetrics.capitalBasis.' }
        externalContributions: { type: number, nullable: true, description: 'Money actually put in and taken out: DEPOSIT − WITHDRAWAL only. EXCLUDES in-kind stock transfers, which move no money. The counterpart to `capitalBasis`, not a variant — conflating the two is what got ADJUSTMENT into trouble (§89.5).' }
        simpleReturnPercent: { type: number, description: '(totalValue − capitalBasis) / capitalBasis, and 0 when capitalBasis ≤ 0 — a non-positive basis would otherwise report a signed nonsense figure.' }
        investmentReturnPercent: { type: number }
        currencyImpactPercent: { type: number }
        cumulativeDividends: { type: number }
        totalDividends: { type: number }
        positionValue: { type: number, description: Open-position value only, cash excluded, each position converted into `currency`. This is the "instruments" component of totalValue. }
        realizedGain: { type: number }
        costBasis: { type: number }
        unrealizedGainLoss: { type: number }
        dayChangeAmount: { type: number }
        dayChangePercent: { type: number }
        dayChangeDate: { type: string, format: date-time }
        unpricedPositions:
          type: integer
          description: |
            Open positions excluded from `totalValue` because no market value is known (§70).
            They are NOT valued at their cost basis — a cost is not a price.
        priceAsOf:
          type: string
          format: date-time
          nullable: true
          description: Oldest resolved price timestamp across this portfolio's open positions.
        priceSource:
          type: string
          nullable: true
          description: "'quote' or 'fallback' — whether the value is a live price or a remembered one."
        capitalBasisReturnPercent: { type: number, nullable: true }
        capitalBasisReturnAmount: { type: number, nullable: true }
        capitalBasisSource: { type: string, nullable: true }
        capitalBasisSuppressedReason: { type: string, nullable: true }
        capitalBasisReturnBasisKind: { type: string, nullable: true }
        historyCoherence:
          type: object
          properties:
            status: { type: string }
            reason: { type: string, nullable: true }
            affectedSymbolCount: { type: integer }
            issues: { type: array, items: { type: object } }
    Transaction:
      description: >-
        A portfolio transaction row. For `type: DIVIDEND`, `price` is the
        per-share gross dividend, `quantity × price` is the gross total, `taxes`
        is the withholding tax, and `totalAmount` is the **net** (gross − taxes).
        BUY/SELL rows keep `totalAmount = quantity × price + fees`.
        `TRANSFER_OUT`/`TRANSFER_IN` rows are an in-kind movement of the
        instrument between portfolios: `price` is the source lot's cost carried
        over unchanged, `totalAmount` is informational, `realizedGainLoss` is
        absent because nothing was disposed of, and the row has **no cash
        effect and is not an external flow**. It must not be read as a trade.
      allOf:
        - $ref: '#/components/schemas/FeeFxFields'
        - type: object
          required: [id, portfolioId, portfolioName, type, instrumentSymbol, instrumentName, quantity, price, fees, totalAmount, currency, priceCurrency, instrumentCurrency, assetType, executedAt, createdAt, displayCurrency, convertedTotalAmount, convertedPrice, convertedFees]
          properties:
            id: { type: string, format: uuid }
            portfolioId: { type: string, format: uuid }
            portfolioName: { type: string }
            positionId: { type: string, format: uuid, nullable: true }
            type: { type: string }
            instrumentSymbol: { type: string }
            instrumentName: { type: string }
            quantity: { type: number }
            price: { type: number }
            fees: { type: number }
            taxes:
              type: number
              nullable: true
              description: Withholding tax on a DIVIDEND (gross − taxes = net totalAmount); null otherwise
            totalAmount: { type: number }
            currency: { type: string }
            priceCurrency: { type: string }
            instrumentCurrency: { type: string }
            assetType: { type: string }
            executedAt: { type: string, format: date-time }
            createdAt: { type: string, format: date-time }
            displayCurrency:
              type: string
              description: Currency used to display and total the row; the owning portfolio's base currency
            convertedTotalAmount: { type: number }
            convertedPrice: { type: number }
            convertedFees: { type: number }
            convertedRealizedGainLoss: { type: number, nullable: true }
            sector:
              type: string
              nullable: true
              description: Sector of the transaction's position (read from the position, not stored on the row)
            country:
              type: string
              nullable: true
              description: Country of the position's instrument, read from the position

            externalSource:
              type: string
              nullable: true
              description: Import provenance tag; NULL for manually-created rows
            externalId:
              type: string
              nullable: true
              description: Importer-supplied dedup key; unique per externalSource
            originalQuantity:
              type: number
              nullable: true
              description: Pre-split/pre-restatement quantity; frozen at creation
            originalPrice:
              type: number
              nullable: true
              description: Pre-split/pre-restatement price; frozen at creation
            notes:
              type: string
              nullable: true
              description: Optional user note on the transaction (e.g. dividend remittance details)
            labels:
              type: array
              items: { $ref: '#/components/schemas/Label' }

    # ─── Fees & FX (fees-and-custom-fx proposal D27–D31) ──────
    FeeFxFields:
      type: object
      properties:
        exchangeRate:
          type: number
          nullable: true
          description: >-
            Transaction-currency -> display/base-currency rate. Null when rates
            equal. Manual values are user-provided truth; automatic are resolved
            by the system at write time.
        rateSource:
          type: string
          nullable: true
          enum: [automatic, manual]
        feeCurrency:
          type: string
          nullable: true
          description: ISO 4217; defaults to the transaction currency when omitted.
        feeRateSource:
          type: string
          nullable: true
          enum: [automatic, manual]
        feeExchangeRate:
          type: number
          nullable: true
          description: Fee-currency -> transaction-currency rate for settlement.
    CreateTransactionRequest:
      type: object
      allOf:
        - $ref: '#/components/schemas/FeeFxFields'
        - type: object
          properties:
            type: { type: string }
            symbol: { type: string }
            quantity: { type: number }
            price: { type: number }
            priceCurrency: { type: string }
            currency: { type: string }
            fees: { type: number }
            feesType: { type: string, enum: [fixed, pct] }
            taxes:
              type: number
              nullable: true
              description: >-
                Withholding tax on a DIVIDEND (nullable, ≥ 0). When set for
                `type: DIVIDEND`, totalAmount is stored net (quantity × price − taxes).
            notes:
              type: string
              nullable: true
              description: Optional user note on the transaction
            executedAt: { type: string, format: date-time }
    DepositCashRequest:
      allOf:
        - $ref: '#/components/schemas/FeeFxFields'
        - type: object
          required: [amount]
          properties:
            amount: { type: number }
            currency: { type: string, description: Defaults to the portfolio baseCurrency; any registry currency allowed }
            description: { type: string }
            transactionDate: { type: string }
    WithdrawCashRequest:
      allOf:
        - $ref: '#/components/schemas/FeeFxFields'
        - type: object
          required: [amount]
          properties:
            amount: { type: number }
            currency: { type: string, description: Defaults to the portfolio baseCurrency; any registry currency allowed }
            description: { type: string }
            transactionDate: { type: string }
    TransferCashRequest:
      allOf:
        - $ref: '#/components/schemas/FeeFxFields'
        - type: object
          required: [amount, currency, toPortfolioId]
          properties:
            amount: { type: number }
            currency: { type: string }
            description: { type: string }
            transactionDate: { type: string }
            toPortfolioId: { type: string, format: uuid }
            targetAmount: { type: number, nullable: true, description: D22 elastic target leg; server-computed when omitted }
            targetFxRate: { type: number, nullable: true }
    CurrencyInfo:
      type: object
      required: [code, name, minorUnits, popular]
      properties:
        code: { type: string, description: ISO 4217 code }
        name: { type: string }
        symbol: { type: string }
        minorUnits: { type: integer }
        popular: { type: boolean }
    CurrenciesResponse:
      type: object
      required: [currencies]
      properties:
        currencies:
          type: array
          items: { $ref: '#/components/schemas/CurrencyInfo' }

    # ─── Portfolio cash (plan §62) ─────────────────────────────────────
    CashTransaction:
      allOf:
        - $ref: '#/components/schemas/FeeFxFields'
        - type: object
          required: [id, portfolioId, type, amount, currency, createdAt]
          properties:
            id: { type: string, format: uuid }
            portfolioId: { type: string, format: uuid }
            type: { type: string }
            amount: { type: number }
            currency: { type: string }
            createdAt: { type: string, format: date-time }
            description: { type: string, nullable: true }
            transactionDate: { type: string, nullable: true }
            fees: { type: number, nullable: true }
            feesType: { type: string, nullable: true }
            toPortfolioId: { type: string, format: uuid, nullable: true }
            balanceAfter: { type: number, nullable: true, description: Row's own-currency balance after this tx (ledger-derived, window sum, no storage) }
            portfolioName: { type: string, nullable: true }
            externalSource:
              type: string
              nullable: true
              description: Import provenance tag; NULL for manually-created rows
            externalId:
              type: string
              nullable: true
              description: Importer-supplied dedup key; unique per externalSource
            labels:
              type: array
              items: { $ref: '#/components/schemas/Label' }

    RecentCashTransaction:
      type: object
      required: [id, portfolioId, type, displayLabel, amount, currency, date, createdAt, isInternalTransfer]
      properties:
        id: { type: string, format: uuid }
        portfolioId: { type: string, format: uuid }
        portfolioName: { type: string, nullable: true }
        type: { type: string }
        displayLabel: { type: string }
        amount: { type: string }
        currency: { type: string }
        exchangeRate: { type: number, nullable: true }
        reference: { type: string, nullable: true }
        date: { type: string }
        description: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        toPortfolioId: { type: string, format: uuid, nullable: true }
        fees: { type: number, nullable: true }
        taxes: { type: number, nullable: true }
        isInternalTransfer: { type: boolean }
        feeCurrency: { type: string, nullable: true }
        rateSource: { type: string, nullable: true, enum: [automatic, manual] }
        feeRateSource: { type: string, nullable: true, enum: [automatic, manual] }
        feeExchangeRate: { type: number, nullable: true }
        labels:
          type: array
          items: { $ref: '#/components/schemas/Label' }
    RecentCashTransactionsPage:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/RecentCashTransaction' } }
        meta:
          type: object
          properties:
            total: { type: integer }
            page: { type: integer }
            limit: { type: integer }
            totalPages: { type: integer }

    # ─── Import API (wallets-import-api §23) ─────────────────
    ImportPortfolioBootstrapRequest:
      type: object
      required: [externalSource, name, currency]
      properties:
        externalSource: { type: string }
        name: { type: string }
        currency: { type: string }
        baseCurrency: { type: string }
    ImportPortfolioBootstrapResponse:
      type: object
      required: [id, name, currency, created]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        currency: { type: string }
        baseCurrency: { type: string }
        created:
          type: boolean
          description: true = just inserted (external_source tagged); false = already existed (not re-tagged)
    ImportLabelBootstrapRequest:
      type: object
      required: [externalSource, labels]
      properties:
        externalSource: { type: string }
        labels:
          type: array
          minItems: 1
          maxItems: 200
          description: Label names to ensure; idempotent per (user, name)
          items: { type: string, minLength: 1, maxLength: 40 }
    ImportLabelBootstrapResponse:
      type: object
      required: [labels]
      properties:
        labels:
          type: array
          items:
            type: object
            required: [name, id]
            properties:
              name: { type: string }
              id: { type: string, format: uuid }
              created:
                type: boolean
                description: true = just created; false = already existed
    ImportTransactionsRequest:
      type: object
      required: [source, transactions]
      properties:
        source:
          type: object
          required: [externalSource, spreadsheetId, sheet]
          properties:
            externalSource: { type: string }
            spreadsheetId: { type: string }
            sheet: { type: string }
        transactions:
          type: array
          maxItems: 500
          description: Idempotent; re-submitting the same externalId array is a no-op
          items: { $ref: '#/components/schemas/ImportTransaction' }
    ImportTransaction:
      type: object
      required: [externalId, portfolioName, executedAt]
      properties:
        externalId:
          type: string
          description: Stable dedup key derived by the importer (e.g. SHA256 of source row fields)
        portfolioName:
          type: string
          description: Must exist for this user; use portfolios/bootstrap to create missing ones
        executedAt: { type: string, format: date-time }
        cashTx: { $ref: '#/components/schemas/ImportPortfolioCashTx' }
        portfolioTx:
          $ref: '#/components/schemas/ImportPortfolioTx'
          description: Omit for pure-cash events (DEPOSIT/WITHDRAWAL)
    ImportPortfolioCashTx:
      allOf:
        - $ref: '#/components/schemas/FeeFxFields'
        - type: object
          required: [type, amount, currency]
          properties:
            type:
              type: string
              enum: [DEPOSIT, WITHDRAWAL, TRANSFER]
            amount:
              type: number
              description: Signed; negative = cash out
            currency: { type: string }
            description: { type: string, nullable: true }
            transactionDate: { type: string, format: date, nullable: true }
            fees: { type: number, nullable: true }
            feesType: { type: string, enum: [fixed, pct], nullable: true }
            exchangeRate: { type: number, nullable: true }
            toPortfolioName: { type: string, nullable: true, description: TRANSFER target; must exist and differ from the source portfolio }
            targetAmount: { type: number, nullable: true }
            reference: { type: string, nullable: true }
            labels:
              type: array
              maxItems: 20
              description: Label names to bootstrap + attach (unknown name → row error)
              items: { type: string, minLength: 1, maxLength: 40 }
    ImportPortfolioTx:
      allOf:
        - $ref: '#/components/schemas/FeeFxFields'
        - type: object
          required: [portfolioId, type, instrumentSymbol, quantity, price, currency]
          properties:
            portfolioId: { type: string, format: uuid }
            type:
              type: string
              enum: [BUY, SELL, DIVIDEND, EXPIRATION, TRANSFER_OUT, TRANSFER_IN]
              description: >-
                `TRANSFER_OUT` moves an instrument, unchanged, out of this
                portfolio to another one — a real in-kind (delivery-versus-
                payment-free) transfer between brokers. It is NOT a sale: no
                realised P/L is booked and no cash moves. `TRANSFER_IN` is its
                receiving leg. Send only `TRANSFER_OUT`; the receiving leg is
                derived by the server, one row per source lot drawn FIFO, each
                carrying that lot's own price. `quantity` on such a row is the
                quantity to move; `price` is the source lot's cost and is
                determined server-side from the FIFO draw, not supplied by the
                caller.
            toPortfolioName:
              type: string
              nullable: true
              description: >-
                Required iff `type` is `TRANSFER_OUT`; must exist and differ
                from the source portfolio. The receiving portfolio takes the
                instrument at the source lot's cost basis.
            instrumentSymbol: { type: string }
            instrumentName: { type: string, nullable: true }
            assetType: { type: string, default: STOCK }
            sector: { type: string, nullable: true }
            industry: { type: string, nullable: true }
            country:
              type: string
              nullable: true
              description: ISO-2 country code (e.g. PL) sourced from the import catalog
            countryCode:
              type: string
              nullable: true
              description: Legacy 2/3-letter country code when it differs from the ISO-2 country
            quantity: { type: number, description: Post-restatement quantity used in calculations }
            price: { type: number, description: Post-restatement unit price used in calculations }
            originalQuantity:
              type: number
              nullable: true
              description: Pre-restatement quantity; frozen at creation
            originalPrice:
              type: number
              nullable: true
              description: Pre-restatement unit price; frozen at creation
            currency:
              type: string
              description: >-
                The currency the trade was PAID or SETTLED in. This is not
                necessarily the instrument's listing currency — a broker will sell
                a GBP-listed stock priced in PLN — so it must not be used as the
                instrument's currency.
            listingCurrency:
              type: string
              nullable: true
              description: >-
                The currency the instrument TRADES in, when the importer resolved
                it. Takes precedence over `currency` for the stored
                `instrumentCurrency`; `currency` is used only as a fallback. Set
                it whenever the source is authoritative (a crypto quote pair, a
                venue-qualified listing), and leave it null when the instrument's
                currency is genuinely unknown — the "never guess" rule applies, and
                a wrong listing currency is worse than a known-missing one.
            fees: { type: number, nullable: true }
            feesType: { type: string, enum: [fixed, pct], nullable: true }
            taxes: { type: number, nullable: true }
            realizedGainLoss: { type: number, nullable: true }
            executedAt: { type: string, format: date-time, nullable: true }
            direction:
              type: string
              enum: [LONG, SHORT]
              nullable: true
              description: "SHORT marks a short-option open (position-creating, regardless of type); for type=EXPIRATION it closes the short-option lot at zero value (zero cash effect)"
            optionType: { type: string, enum: [CALL, PUT], nullable: true }
            contractSize: { type: number, nullable: true }
            positionLabels:
              type: array
              maxItems: 20
              description: Label names to attach to the row's open position (resolved server-side per user; unknown names are a row error)
              items: { type: string, minLength: 1, maxLength: 40 }
            transactionLabels:
              type: array
              maxItems: 20
              description: Label names to attach to the row's portfolio transaction (same resolution as positionLabels)
              items: { type: string, minLength: 1, maxLength: 40 }
    ImportTransactionsResponse:
      type: object
      required: [inserted, skipped, errors]
      properties:
        inserted: { type: integer }
        skipped: { type: integer }
        errors:
          type: array
          description: Row-level failures; the rest of the batch still succeeds
          items:
            type: object
            required: [externalId, error]
            properties:
              externalId: { type: string }
              error: { type: string }
              message: { type: string }
        syncRun: { $ref: '#/components/schemas/SyncRun' }
        # §69.3 — which portfolios this import touched, and how many rows landed in
        # each. The re-backfill itself is unchanged (§69.3 enqueues a full rebuild
        # per touched portfolio), but it was **invisible afterwards**: the handler
        # computed the set, logged a count to stderr, and discarded it. So the
        # operator could not answer "did my re-import actually reach IKE Beata?"
        # except by waiting for the chart to change.
        #
        # `rowCount` counts rows that INSERTED, not rows submitted. A batch of 500
        # already-present rows touched nothing and re-backfills nothing, and
        # reporting 500 there would make the idempotency path look like a rebuild.
        affectedPortfolios:
          type: array
          description: |
            Portfolios whose history this import changed, each with the number of
            rows inserted into it. Empty/absent when the batch inserted nothing.
            This is the set a full re-backfill was queued for, so it is also the
            set to look at when a chart looks stale after an import.
          items:
            type: object
            required: [portfolioId, rowCount]
            properties:
              portfolioId: { type: string, format: uuid }
              name: { type: string, nullable: true, description: Portfolio name at import time — an operator reading a log wants the name, not the uuid. }
              rowCount: { type: integer, description: Rows INSERTED into this portfolio by this batch. }
        backfillQueued:
          type: boolean
          description: |
            Whether a re-backfill was enqueued. Distinguishes "nothing changed, so
            nothing to rebuild" (false) from "rebuild queued but the queue is
            backed up" — which the caller can then read off
            `portfolio_backfill_metadata` instead of guessing from a log line.
    SyncRun:
      type: object
      required: [id, externalSource, spreadsheetId, sheet, status, insertedCashTx, insertedPtx, skipped]
      properties:
        id: { type: integer }
        externalSource: { type: string }
        spreadsheetId: { type: string }
        sheet: { type: string }
        lastRow: { type: integer, nullable: true }
        status: { type: string, enum: [pending, running, done, failed] }
        startedAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        error: { type: string, nullable: true }
        insertedCashTx: { type: integer }
        insertedPtx: { type: integer }
        skipped: { type: integer }
    SyncRunsResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SyncRun' }
        total: { type: integer }
    SourceWipeResponse:
      type: object
      properties:
        deleted:
          type: object
          properties:
            cashTransactions: { type: integer }
            portfolios: { type: integer }
            syncRuns: { type: integer }
            positions: { type: integer }
            portfolioTransactions: { type: integer }
            valueSnapshots: { type: integer }
            shares: { type: integer }
            portfolioBackfillMetadata: { type: integer }
    ApplySplitRequest:
      type: object
      required: [symbol, factor, effectiveDate]
      properties:
        symbol: { type: string }
        factor: { type: number }
        effectiveDate: { type: string, format: date }
        source: { type: string, description: "Event provenance, for example openst:fmp or admin" }
    ApplySplitResponse:
      type: object
      required: [updatedTransactions, affectedPortfolios]
      properties:
        updatedTransactions: { type: integer }
        affectedPortfolios: { type: integer }

    # ─── Watchlists ────────────────────────────────────────────
    Watchlist:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
