    # ─── Portfolios ────────────────────────────────────────────
    Portfolio:
      type: object
      required: [id, userId, name, capitalBasis, currentValue, isPublic, isMarginEnabled, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }
        baseCurrency: { type: string }
        # §41/S3 — RENAMED from `totalInvested`. Capital BASIS: net external
        # contributions PLUS the cost of anything transferred in or out. Not
        # "capital you put in" — see `externalContributions` for that.
        capitalBasis: { type: number }
        currentValue: { type: number }
        isPublic: { type: boolean }
        isVirtual: { type: boolean, description: "Read-only view over the instruments carrying `labelId`. Always false on a casual portfolio." }
        labelId: { type: string, format: uuid, nullable: true, description: "The label whose instruments a virtual portfolio mirrors. Always set when `isVirtual` is true; null on a casual portfolio." }
        # §87.5 — UI-ONLY per-portfolio switch. It pre-ticks the "also create a cash
        # transaction" checkbox on the buy/sell form so the box reflects what will
        # actually happen. It deliberately does NOT govern the sheet import: that
        # path uses its own hardcoded kontо list (portfoliost-sheets-sync
        # ALWAYS_CASH_LEG), and an imported AU=0 trade on a portfolio with this ON
        # still imports with no cash row. Two independent mechanisms, on purpose.
        cashLegOnTrade: { type: boolean }
        isMarginEnabled: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        metrics:
          type: object
          properties:
            totalReturn: { type: number }
            openPositions: { type: integer }
            unrealizedGainLoss: { type: number }
        cash:
          $ref: '#/components/schemas/PortfolioCash'
          description: Portfolio-native cash position (plan §62)
    CreatePortfolioRequest:
      type: object
      description: >-
        Body for both POST /portfolios and PATCH /portfolios/{id}.

        Virtual portfolios (`isVirtual: true`) are read-only views over the
        instruments carrying `labelId` — they have no cash ledger. A virtual
        request therefore REQUIRES `labelId` (an existing label owned by the
        caller); a casual portfolio (the default — `isVirtual` false or absent)
        MUST NOT carry one. A virtual create without a label is rejected 422.

        Update semantics: a virtual portfolio's `cashLegOnTrade` is always
        false, so PATCH rejects enabling the cash leg on a virtual portfolio
        (422). PATCH also rejects an update that would leave the virtual/casual
        state invalid — a `labelId` on a casual portfolio, or clearing a virtual
        portfolio's `labelId` (both 422).

        OpenAPI 3.0 cannot express a conditional requirement like this without
        changing the shape every consumer compiles against, so the rule is
        declared here and enforced server-side by the wallets zod refinement
        and route guards. `scripts_check_spec.py` asserts these fields stay
        declared.
      required: [name]
      properties:
        name: { type: string }
        description: { type: string, nullable: true }
        currency: { type: string }
        isPublic: { type: boolean }
        isVirtual: { type: boolean, default: false, description: "True for a virtual portfolio; see the schema description for the label requirement." }
        labelId: { type: string, format: uuid, nullable: true, description: "Required when `isVirtual` is true, forbidden otherwise. Null on a casual portfolio." }
        # §87.5 — same UI-only meaning as on Portfolio; PATCH reuses this schema.
        cashLegOnTrade: { type: boolean }
    PortfolioTotalMetrics:
      description: |
        The dashboard headline aggregate, all amounts in `baseCurrency`.

        §68 — the four headline figures, and what `totalValue` means changed:

          instrumentsValue  positions only
          cashValue         the cash BALANCE (not a flow)
          totalValue        instrumentsValue + cashValue
          capitalBasis      capital at risk (external contributions + in-kind cost)

        `totalValue` previously excluded cash, which made the headline disagree
        with the portfolio cards by exactly the cash balance (§63.3). It now
        means the whole account.

        §41/S3 — `totalInvested` was RENAMED to `capitalBasis`, and the
        genuinely-external figure is now its own field, `externalContributions`.
        The two are different questions and the old names pointed the wrong way:
        the field named `externalCapitalBasis` reported the SAME number as
        `totalInvested` (which includes in-kind transfers) while the function
        named `externalCashInvested` excluded them. That mislabelling already
        caused two wrong conclusions during the transfer work.
      type: object
      required: [baseCurrency, instrumentsValue, cashValue, totalValue, capitalBasis, portfolioBreakdown]
      properties:
        instrumentsValue:
          type: number
          description: Open-position market value only, cash excluded, converted into baseCurrency. Σ of each position's own instrument currency at its own rate — never a raw cross-currency sum.
        cashValue:
          type: number
          description: Cash balance across all portfolios in baseCurrency (Σ per-currency balances converted). Renamed from `totalCash` in §68 — a balance, not a flow. May be negative on a margin account, and must not be clamped.
        totalValue:
          type: number
          description: 'The whole account: instrumentsValue + cashValue. CHANGED in §68 — this used to be positions-only, which is what made the headline miss cash.'
        capitalBasis:
          type: number
          description: |
            Capital BASIS in baseCurrency: net external contributions (DEPOSIT − WITHDRAWAL,
            each at its own historical rate) PLUS the cost of anything transferred in or out,
            signed.

            At COST, not market: a basis travels with the shares, so the accrued unrealised
            gain is just `totalValue − capitalBasis` and follows whichever account holds the
            stock. Rebasing at the transfer-date market would delete real profit.

            In-kind transfers are part of this definition, not excluded — this was always the
            stated contract and the implementation did not honour it until §41/#37. The honest
            consequence: a transfer between two of the user's own portfolios RAISES one
            portfolio's basis and LOWERS the other's. The aggregate is unaffected because the
            legs net to zero, but a per-portfolio number on this basis is NOT "capital you put
            in" — that is `externalContributions`.
        externalContributions:
          type: number
          nullable: true
          description: |
            Money actually put in and taken out: DEPOSIT − WITHDRAWAL only, each at its own
            historical rate. EXCLUDES in-kind stock transfers, which move no money.

            The counterpart to `capitalBasis`, not a variant of it. Keep them apart —
            conflating "money put in" with "capital at risk" is what got `ADJUSTMENT` into
            trouble (§89.5).
        totalGainLoss:
          type: number
          description: 'totalValue − capitalBasis. Moves with §68''s change to totalValue.'
        returnPercentage:
          type: number
          description: totalGainLoss / capitalBasis. Moves with §68's change to totalValue.
        baseCurrency: { type: string }
        portfolioBreakdown:
          type: array
          description: Per-portfolio rows. §68 — each carries the same cash/instruments split, so Σ breakdown == the headline and a card can render its own split without a second request.
          items:
            type: object
            required: [id, name, instrumentsValue, cashValue, totalValue, capitalBasis]
            properties:
              id: { type: string }
              name: { type: string }
              instrumentsValue:
                type: number
                description: This portfolio's open positions only, converted into baseCurrency.
              cashValue:
                type: number
                description: This portfolio's cash balance in baseCurrency. May be negative.
              totalValue:
                type: number
                description: instrumentsValue + cashValue for this portfolio.
              capitalBasis: { type: number }
              returnPercentage: { type: number }
              weight: { type: number }
              unpricedPositions: { type: integer, description: Open positions with no market value, excluded from instrumentsValue (§70). }
              priceAsOf: { type: string, format: date-time, nullable: true, description: Oldest resolved price timestamp for this portfolio's positions. }
              priceSource: { type: string, nullable: true, description: "'quote' or 'fallback' — whether the value is a live price or a remembered one." }
        capitalBasisReturnPercent: { type: number, nullable: true }
        capitalBasisReturnAmount: { type: number, nullable: true }
        unpricedPositions:
          type: integer
          description: |
            Open positions excluded from `instrumentsValue` because no market value is known (§70).
            They are NOT valued at their cost basis — a cost is not a price, and a plausible
            wrong number is worse than an admitted gap. Non-zero means the pricing pipeline
            has not caught up (nothing used to maintain `positions.market_value` on a schedule).
        priceAsOf:
          type: string
          format: date-time
          nullable: true
          description: |
            OLDEST resolved price timestamp across the positions included in this aggregate.
            The newest quote can be minutes old while the oldest is a day old, and a total built
            from mixed ages is only as fresh as its stalest input — so the headline reports the
            oldest. Null when no position could be priced at all.
        priceSource:
          type: string
          nullable: true
          description: |
            Dominant price provenance — 'quote' (resolved from instruments) or 'fallback'
            (a stored price reused because instruments could not be reached). 'fallback' means
            the figure is a remembered price, not a current one.
        capitalBasisSource: { type: string, nullable: true }
        capitalBasisSuppressedReason: { type: string, nullable: true }
        capitalBasisReturnBasisKind: { type: string, nullable: true }
        cashBreakdown:
          type: array
          description: Per-currency cash summary (dashboard cash card)
          items:
            type: object
            required: [currency, balance]
            properties:
              currency: { type: string }
              balance: { type: number }
              weight:
                type: number
                nullable: true
                description: |
                  Share of GROSS cash exposure in this currency, 0–100, summing to 100 (§70.5).
                  Deliberately NOT `balance / net`: IBKR holds +64,898 EUR against
                  −45,434 USD, so the net nearly cancels and net-based weights explode to
                  +648% / −398%. The signed `balance` still reports direction — the mixed
                  signs are real (currency conversions the broker performs without recording
                  them) — while the weight answers "how much of this account's cash is in this
                  currency", which is well defined whatever the signs do.
    PortfolioCash:
      description: Portfolio-native cash position (plan §62) — per-currency balances derived by transaction replay
      type: object
      required: [baseCurrency, balances, total]
      properties:
        baseCurrency: { type: string }
        balances:
          type: array
          items:
            type: object
            required: [currency, balance]
            properties:
              currency: { type: string }
              balance: { type: number, description: Balance in that currency }
        total: { type: number, description: Base-currency total, server-computed }
    PortfolioCashHistory:
      description: Cash balance history — data[].balance is the base-currency total of all currency balances at that date
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            type: object
            required: [date, balance, change, percentChange, high, low]
            properties:
              date: { type: string, format: date-time }
              balance: { type: number }
              change: { type: number }
              percentChange: { type: number, nullable: true }
              high: { type: number }
              low: { type: number }
        meta:
          type: object
          required: [period, resolution, high, low, average, startDate, endDate, change]
          properties:
            period: { type: string }
            resolution: { type: string }
            high: { type: number }
            low: { type: number }
            average: { type: number }
            startDate: { type: string, format: date-time }
            endDate: { type: string, format: date-time }
            change: { type: number }
            percentChange: { type: number, nullable: true }
    HeldStock:
      type: object
      properties:
        symbol: { type: string }
        name: { type: string }
        logo: { type: string, nullable: true }
        currentPrice: { type: number }
        changePercent: { type: number }
        assetType: { type: string }
        totalQuantity: { type: number }
        totalValue: { type: number }
    HeldStocks:
      type: object
      properties:
        stocks: { type: array, items: { $ref: '#/components/schemas/HeldStock' } }
        totalCount: { type: integer }
    PortfolioShare:
      type: object
      required: [id, portfolioId, portfolioName, createdAt, viewCount, privacySettings]
      properties:
        id: { type: string, format: uuid }
        portfolioId: { type: string, format: uuid }
        portfolioName: { type: string }
        displayName: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, nullable: true }
        viewCount: { type: integer }
        privacySettings:
          type: object
          properties:
            showValues: { type: boolean }
            showHoldings: { type: boolean }
            showPositions: { type: boolean }
            showPerformanceChart: { type: boolean }
            showTransactionHistory: { type: boolean }
            showAssetAllocation: { type: boolean }
            showSectorDistribution: { type: boolean }
            showGeographicBreakdown: { type: boolean }
            showIndustryDistribution: { type: boolean }
            performanceChartReturnType: { type: string }
          additionalProperties: true
    Position:
      type: object
      required: [id, portfolioId, symbol, companyName, assetType, purchaseCurrency, instrumentCurrency, quantity, avgCostBasis, totalCostBasis, costBasis, realizedGainLoss, sector, industry, country, isOpen, openedAt, currentPrice, priceSource, priceAsOf, marketValue, unrealizedGainLoss, percentageChange, percentOfPortfolio, dayChange, dayChangePercent, displayCurrency]
      properties:
        id: { type: string, format: uuid }
        # #115 — the portfolio this row is VIEWED under (the membership the list
        # was queried by), not a single-owner column: ownership is many-to-many
        # (a position may belong to several portfolios via position_portfolios).
        portfolioId:
          type: string
          format: uuid
          description: Portfolio membership represented by this row; a position shared across portfolios appears once per membership.
        symbol: { type: string }
        companyName: { type: string }
        assetType: { type: string }
        contractSize: { type: number, nullable: true }
        direction:
          type: string
          enum: [LONG, SHORT]
          nullable: true
          description: Position direction; SHORT identifies a short derivative position.
        optionType:
          type: string
          enum: [CALL, PUT]
          nullable: true
          description: Derivative option type; null for non-option positions.
        strikePrice:
          type: number
          nullable: true
          description: Option strike price in instrument currency, when known.
        expirationDate:
          type: string
          format: date
          nullable: true
          description: Option expiration date, when known.
        purchaseCurrency: { type: string }
        instrumentCurrency: { type: string }
        quantity: { type: number }
        averageCostBasis: { type: number }
        avgCostBasis: { type: number }
        instrumentAvgCostBasis: { type: number }
        totalCostBasis: { type: number }
        costBasis: { type: number }
        realizedGainLoss: { type: number }
        sector: { type: string }
        industry: { type: string }
        country: { type: string }
        isOpen:
          type: boolean
          description: True when the position is currently held; false when it is closed and retained as history.
        openedAt: { type: string, format: date-time }
        closedAt:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when the position was fully closed; null while the position is open.
        currentPrice: { type: number }
        priceSource: { type: string }
        priceAsOf: { type: string, format: date-time }
        marketValue: { type: number }
        unrealizedGainLoss: { type: number }
        percentageChange: { type: number }
        percentOfPortfolio: { type: number }
        dayChange: { type: number }
        dayChangePercent: { type: number }
        preMarketPrice: { type: number, nullable: true }
        preMarketChangePercent: { type: number, nullable: true }
        afterHoursPrice: { type: number, nullable: true }
        afterHoursChangePercent: { type: number, nullable: true }
        metrics: { type: object, additionalProperties: true }
        displayCurrency: { type: string }
        # §83.5 — the owning portfolio's name, for the all-portfolios list only.
        # Nullable (not absent-from-schema) so `/portfolios/{id}/positions` keeps
        # satisfying `Position` unchanged: a per-portfolio page does not need to
        # label every row with the portfolio it is already entirely about.
        portfolioName:
          type: string
          nullable: true
          description: Portfolio name for consolidated rows; null on the per-portfolio route, where the route already supplies this context.
        logo: { type: string, nullable: true }
        labels:
          type: array
          items: { $ref: '#/components/schemas/Label' }

    Label:
      type: object
      required: [id, name, color]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        color: { type: string }
        createdAt: { type: string, format: date-time }

    LabelInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        color: { type: string }

    SetLabelsRequest:
      type: object
      required: [labelIds]
      properties:
        labelIds:
          type: array
          items: { type: string, format: uuid }

    BackfillRecomputeResponse:
      type: object
      required: [backfillStatus]
      properties:
        backfillStatus:
          type: string
          enum: [pending, complete, failed]

    PortfolioAnalytics:
      type: object
      properties:
        backfillStatus:
          type: string
          enum: [pending, complete, failed]
          nullable: true
        timeframe: { type: string }
        performance:
          type: object
          properties:
            totalValue: { type: number }
            capitalBasis: { type: number }
            totalReturn: { type: number }
            totalReturnPercent: { type: number }
            simpleReturnPercent: { type: number }
            investmentReturnPercent: { type: number }
            currencyImpactPercent: { type: number }
            realizedGains: { type: number }
            unrealizedGains: { type: number }
            annualizedReturn: { type: number, nullable: true }
            moneyWeightedReturn: { type: number, nullable: true }
            annualizedReturnWithheldReason: { type: string, nullable: true }
            moneyWeightedReturnWithheldReason: { type: string, nullable: true }
            timeWeightedReturn: { type: number, nullable: true }
            sharpeRatio: { type: number }
            sortinoRatio: { type: number }
            calmarRatio: { type: number }
            winRate: { type: number }
            winCount: { type: integer }
            lossCount: { type: integer }
            volatility: { type: number }
            maxDrawdown: { type: number }
            monthlyReturns:
              type: array
              items:
                type: object
                properties:
                  month: { type: string }
                  returnPercent: { type: number }
            timeSeries:
              type: array
              items:
                type: object
                properties:
                  date: { type: string }
                  value: { type: number }
                  # Cumulative net money-in (deposits − withdrawals ± transfer
                  # legs), same currency as `value` — the "invested" line the
                  # performance chart overlays so value − invested = profit.
                  invested: { type: number, nullable: true }
                  # §78.5 — base-currency COST of positions held on this day that
                  # have NO price. `value` already excludes them, because a
                  # held-but-unpriced row contributes 0 to the sum while its cash
                  # leg has been deducted. That is correct arithmetic and a
                  # completely misleading chart: PROD showed IKE Marek losing
                  # 76.1% on 2021-11-09 when it had in fact bought 5,717.65 of
                  # government bonds that every price provider 404s on.
                  #
                  # **This is the only place the withheld amount exists**, and it
                  # is per-day because the symptom is a step on a specific date —
                  # a window total cannot place it. A UI that shows `value` alone
                  # is showing a series with a hole in it and calling it a return.
                  #
                  # Absent = not measured (a row written before the column
                  # existed). Do NOT default it to 0 on read: the column's own
                  # default is 0, so that reading would claim "nothing withheld"
                  # for exactly the portfolios that most need the warning.
                  unpricedValue: { type: number }
                  # §72.31 — base-currency COST of positions whose price on this day
                  # is a CARRIED-FORWARD close rather than a real bar for this day,
                  # where the market was open. Without this, "partial on which
                  # days" is not answerable from anything: the grid carry-forwards,
                  # so the value *looks* complete. Measured on PROD — Crypto reported
                  # `gapSymbols: ["BTC-USD"]` and 24 coverage days while
                  # `unpricedValue` was 0 on all 1,690 of them, because carry-forward
                  # means a price exists.
                  #
                  # Market closures are EXCLUDED. Carry-forward across a closure is
                  # what the grid is for, and counting it would put ~29% of every
                  # series in this field and bury the real holes. Same predicate as
                  # `fxCoverageHoles`, so the two cannot disagree.
                  carriedValue: { type: number }
                  cumulativeTwr: { type: number }
                  cumulativeMwr: { type: number }
                  cumulativeSimple: { type: number }
        benchmarks:
          type: array
          items:
            type: object
            properties:
              symbol: { type: string }
              name: { type: string }
              timeSeries:
                type: array
                items:
                  type: object
                  properties:
                    date: { type: string }
                    value: { type: number }
              returnPercent: { type: number }
              volatility: { type: number }
        portfolioCurrency: { type: string }
        realizedGain: { type: number }
        monthlyReturns:
          type: array
          items:
            type: object
            properties:
              month: { type: string }
              returnPercent: { type: number }
        # §63.8 — held positions the latest backfill pass had NO price bar for.
        # Non-empty → the `value` series is a *partial* sum (silently
        # under-reported); the SPA should flag it instead of presenting a wrong
        # total. Absent/null = every held symbol priced.
        #
        # §72.30 — WINDOW-WIDE, not last-day: every symbol held on any day of the
        # window that lacked a bar on at least one such day. It says the stored
        # HISTORY is a partial sum, which is NOT the same claim as "the value you
        # are looking at right now is short". See `heldGapSymbols` for that.
        gapSymbols:
          type: array
          nullable: true
          items:
            type: string
        # §72.30 — the subset of `gapSymbols` that is STILL HELD on the window's
        # last day. Non-empty means the LATEST stored point is itself a partial
        # sum, which is the claim a user reading the current value needs.
        #
        # Added because the two were conflated and PROD showed the cost: the SPA
        # rendered "Value excludes N positions without price history" from the
        # window-wide list, and on 2026-10-01 three of the four flagged portfolios
        # (Crypto 1, IKE Beata 7, IKE Marek 6) had EVERY flagged symbol already
        # closed — the current value was complete and the banner claimed otherwise.
        # `heldGapSymbols` is empty for all three; only Rach. rejestrowy PKO BP
        # (ROD0335) was a real current gap.
        heldGapSymbols:
          type: array
          nullable: true
          items:
            type: string
          description: >-
            gapSymbols still held on the window's last day. Non-empty ⇒ the latest
            stored value excludes them. Empty while `gapSymbols` is non-empty ⇒ the
            history is a partial sum but the current value is complete, and the UI
            must say that instead of "value is short".
        # §72.21 — per-symbol count of held days on which the price series came
        # back with NO bar. A symbol the portfolio held on 300 days and got 288
        # bars for is not a `gapSymbol` (it is not missing history, it is missing
        # *scattered* days) yet its series has steps in it that are artefacts of
        # coverage rather than of the portfolio. Neither `gapSymbols` nor
        # `heldGapSymbols` can see that shape: a prefix hole reaches
        # `gapSymbols`, a scattered one never does.
        #
        # **Counts, not dates, and deliberately not a diagnosis.** The dates exist
        # and can run to thousands for a wide window, which is not something to put
        # in a summary row. Nor can this field say WHY a day is absent: at the
        # valuation layer "instruments had no history" and "instruments dropped
        # the bar for want of an FX rate" are the same absence. `unconvertedDates`
        # on the price-bar series separates them; this field reports the size of
        # the effect without inventing a cause.
        #
        # Absent/null = no symbol had a hole, i.e. every held day had a bar.
        fxCoverageHoles:
          type: object
          nullable: true
          additionalProperties:
            type: integer
            minimum: 1
          description: >-
            symbol → number of held days with no returned bar, across the
            backfill window. Non-empty ⇒ the stored history has coverage steps
            that are not market moves, and the UI should say so rather than let a
            step read as a real return. Empty/absent ⇒ no such holes. Overlaps
            `gapSymbols` freely: a symbol may be listed in both, and means
            something different by each.
    PortfolioSnapshot:
      type: object
      properties:
        allocation:
          type: object
          properties:
            # §66.3 — the currency every row below is denominated in. The
            # byCurrency rows are the exception and are labelled BY their own
