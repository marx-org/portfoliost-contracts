name: Release @marx-org/contracts

# On every push to main that touches contracts/**:
#   1. Bump patch from latest v* git tag
#   2. Build TS helpers, commit version bump, push tag
#   3. Create GitHub Release
#   4. Publish to GitHub Packages (@marx-org/contracts)
#
# On pull requests touching contracts/**: validate only.

on:
  push:
    branches: [ "main" ]
    paths: [ "contracts/**" ]
  pull_request:
    branches: [ "main" ]
    paths: [ "contracts/**" ]

jobs:

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@marx-org"

      - name: Bump patch from latest git tag
        id: bump
        run: |
          LATEST=$(git tag --list 'v*' --sort=-version:refname | head -n1)
          if [ -z "$LATEST" ]; then
            NEXT="1.0.0"
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "${LATEST#v}"
            NEXT="${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi
          echo "version=v${NEXT}" >> "$GITHUB_OUTPUT"
          echo "plain=${NEXT}"    >> "$GITHUB_OUTPUT"
          echo "Bumped ${LATEST:-none} → v${NEXT}"

      - name: Write version into package.json
        working-directory: contracts
        run: npm version "${{ steps.bump.outputs.plain }}" --no-git-tag-version

      - name: Install and build TS helpers
        working-directory: contracts
        run: npm install --no-audit --no-fund && npm run build

      - name: Commit version bump and push tag
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add contracts/package.json contracts/package-lock.json
          git commit -m "chore(release-contracts): ${{ steps.bump.outputs.version }}"
          git tag "${{ steps.bump.outputs.version }}"
          git push origin main --follow-tags

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.bump.outputs.version }}
          name: Release ${{ steps.bump.outputs.version }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Packages
        working-directory: contracts
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Validate OpenAPI spec parses
        working-directory: contracts
        run: python3 -c "import yaml; yaml.safe_load(open('openapi.yaml')); print('openapi.yaml parses OK')"

      # yaml.safe_load keeps the LAST duplicate key and reports nothing, so a
      # duplicated property reaches every consumer as a YamlParseError naming the
      # wrong place. §41/S3 renamed `externalCapitalBasis` while `totalInvested`
      # was becoming `capitalBasis`, which collided in three schemas and was
      # caught here rather than in CI. This script existed for that and was not
      # wired in.
      - name: Validate spec has no duplicate property keys
        working-directory: contracts
        run: python3 scripts_check_spec.py

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install, test and build TS helpers
        working-directory: contracts
        run: npm install --no-audit --no-fund && npm test && npm run build
